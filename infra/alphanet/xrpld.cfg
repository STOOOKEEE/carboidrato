# Nœud alphanet local (standalone) sur hermes.
# Sécurité : aucun port peer ; tous les ports écoutent uniquement sur 127.0.0.1.
# - 51233 (ws) et 51234 (rpc) : admin, accessibles seulement par tunnel SSH (infra/alphanet/tunnel.sh).
# - 51236 (ws) : SANS admin (pas de ligne `admin`), exposé aux coéquipiers via public-tunnel.sh :
#   on peut y soumettre des transactions signées, pas arrêter ni administrer le nœud.

[server]
port_rpc_local
port_ws_local
port_ws_public

[port_rpc_local]
port = 51234
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[port_ws_local]
port = 51233
ip = 127.0.0.1
admin = 127.0.0.1
protocol = ws

[port_ws_public]
port = 51236
ip = 127.0.0.1
protocol = ws

[node_size]
small

[node_db]
type = NuDB
path = /var/lib/xrpld/db/nudb

[database_path]
/var/lib/xrpld/db

[debug_logfile]
/var/lib/xrpld/debug.log

# Identifiant de réseau privé, ≤ 1024 exprès : au-delà, chaque transaction doit porter NetworkID, et xrpl.js
# ne l'ajoute que pour un serveur ≥ 1.11 (notre build se présente en 0.0.0-dev → telREQUIRES_NETWORK_ID).
# Il entre dans l'énoncé prouvé par le circuit.
[network_id]
1000

# Sans ça, xrpld écrit tout en DEBUG sur la sortie standard et les logs Docker grossissent sans limite.
[rpc_startup]
{ "command": "log_level", "severity": "warning" }

[ssl_verify]
0

# La section [amendments] (générée par gen-amendments.mjs) est ajoutée à la suite par run.sh.
