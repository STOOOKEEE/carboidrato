# Nœud alphanet local (standalone) sur hermes.
# Sécurité : aucun port peer ; WebSocket et RPC écoutent uniquement sur 127.0.0.1.
# Accès depuis le Mac : tunnel SSH (voir infra/alphanet/tunnel.sh).

[server]
port_rpc_local
port_ws_local

[port_rpc_local]
port = 51234
ip = 127.0.0.1
admin = 127.0.0.1
protocol = http

[port_ws_local]
port = 51233
ip = 127.0.0.1
admin = 127.0.0.1
protocol = ws

[node_size]
small

[node_db]
type = NuDB
path = /var/lib/xrpld/db/nudb

[database_path]
/var/lib/xrpld/db

[debug_logfile]
/var/lib/xrpld/debug.log

[ssl_verify]
0

# La section [amendments] (générée par gen-amendments.mjs) est ajoutée à la suite par run.sh.
